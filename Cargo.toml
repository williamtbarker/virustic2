[package]
name = "virustic2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["William Barker"]
description = "A quality-aware, deterministic viral unitig assembler for single-end and paired-end FASTX"
repository = "https://github.com/williamtbarker/virustic2"
homepage = "https://github.com/williamtbarker/virustic2"
readme = "README.md"
keywords = ["bioinformatics", "viral-genomics", "assembly", "de-bruijn-graph", "fastq"]
categories = ["science", "command-line-utilities"]
exclude = [".github/"]

[lib]
name = "virustic2"
path = "src/lib.rs"

[[bin]]
name = "virustic2"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
